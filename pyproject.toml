[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tiny-rag"
version = "0.1.0"
description = "Lightweight document converting and chunking utilities for RAG experiments."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "sqlite-vec>=0.1.9",
]

[project.optional-dependencies]
converting = [
    "markitdown>=0.1.3",
    "numpy>=1.26",
    "pillow>=10.0",
    "pydantic>=2.0",
    "pypdfium2>=4.30",
    "python-docx>=1.1",
]
excel = [
    "openpyxl>=3.1",
    "pandas>=2.0",
]
test-fixtures = [
    "reportlab>=4.0",
]

[dependency-groups]
integration = [
    "markitdown>=0.1.3",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pandas>=2.0",
    "pillow>=10.0",
    "pydantic>=2.0",
    "pypdfium2>=4.30",
    "python-docx>=1.1",
    "reportlab>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["tiny_rag"]
